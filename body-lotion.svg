<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Mesirée by P body lotion">
  <title>Mesirée by P body lotion</title>
  <style>@font-face{font-family:"MesireeScript";src:url(data:font/woff2;base64,) format("woff2");}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECE3"/><stop offset=".6" stop-color="#E9E2D6"/><stop offset="1" stop-color="#DED5C7"/></linearGradient>
    <radialGradient id="sun" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#FFF8EC" stop-opacity=".7"/><stop offset="1" stop-color="#FFF8EC" stop-opacity="0"/></radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E4E2DD"/><stop offset=".18" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FAFAF8"/><stop offset="1" stop-color="#DAD8D2"/></linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A2A2A"/><stop offset=".3" stop-color="#3A3A3A"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFC4B3"/><stop offset=".35" stop-color="#E3DACB"/><stop offset=".7" stop-color="#DCD2C2"/><stop offset="1" stop-color="#C2B6A4"/></linearGradient>
