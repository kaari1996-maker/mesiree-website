<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Mesirée by P</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="Mesirée by P, home">
        <span class="script">Mesirée</span><small>by</small><span class="script">P</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html#shop">Shop</a>
        <a href="index.html#story">Our story</a>
        <a href="index.html#ingredients">Ingredients</a>
        <a href="index.html#contact">Contact</a>
        <a class="cart-link" href="cart.html" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>Your <span class="script">cart</span></h1>
      <a class="text-link" href="index.html#shop">← Continue shopping</a>
    </div>

    <div class="cart">
      <div id="cart-items" class="cart-items"></div>

      <aside class="summary" aria-label="Order summary">
        <span class="eyebrow" style="color:#111111">Order summary</span>
        <div class="row"><span>Subtotal</span><span id="subtotal">—</span></div>
        <div class="row"><span>Shipping</span><span style="color:#5A5A55">Calculated at checkout</span></div>
        <div class="row total"><span>Total</span><span id="total">—</span></div>
        <button type="button" class="btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          Secure checkout
        </button>
        <!-- Checkout is not connected yet: this is where Stripe or Shopify will go -->
        <div class="checkout-note">Online checkout is coming soon.</div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="display:flex; flex-wrap:wrap; justify-content:space-between; padding-top:28px; padding-bottom:28px; color:#5A5A55">
      <span>© Mesirée by P</span>
      <a href="index.html#contact">Contact</a>
    </div>
  </footer>

  <script src="products.js?v=5"></script>
  <script src="site.js?v=5"></script>
</body>
</html>
